[project]
name = "cicd-python-demo"
version = "0.1.0"
description = "CI/CD学習用のPythonプロジェクト"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import整理)
    "D",    # pydocstyle (docstring)
    "UP",   # pyupgrade
]
ignore = [
    "D100",  # モジュールdocstring不要
    "D104",  # パッケージdocstring不要
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D102", "D103"]  # テストメソッドのdocstringは不要

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]