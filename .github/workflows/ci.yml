# =============================================================
# CI パイプライン - Python プロジェクト
# =============================================================
# トリガー: main/developブランチへのpush、またはPR作成時
# 実行内容: リント(ruff) → テスト(pytest) → カバレッジ
# =============================================================

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# 同じブランチで新しいpushがあったら古いCIをキャンセル（無料枠節約）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------
  # Job 1: コード品質チェック（リント＋フォーマット）
  # -----------------------------------------------------------
  lint:
    name: "🔍 Lint & Format Check"
    runs-on: ubuntu-latest

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係キャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 依存関係インストール
        run: pip install -r requirements-dev.txt

      - name: Ruff リントチェック
        run: ruff check .

      - name: Ruff フォーマットチェック
        run: ruff format --check .

  # -----------------------------------------------------------
  # Job 2: テスト実行
  # -----------------------------------------------------------
  test:
    name: "🧪 Test (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    needs: lint  # リントが通ってからテスト実行

    strategy:
      matrix:
        python-version: [ "3.11", "3.12" ]

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 依存関係キャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 依存関係インストール
        run: pip install -r requirements-dev.txt

      - name: pytest 実行（カバレッジ付き）
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml

      - name: カバレッジレポートをアーティファクトとして保存
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
